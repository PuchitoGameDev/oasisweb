---
layout: default
---
<article>
<div class="blog-eyebrow">{% if page.tags.size > 0 %}{{ page.tags | first | upcase }}{% else %}UPDATE{% endif %}</div>
<h1 class="blog-h1">{{ page.title }}</h1>
<div class="blog-meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.tags.size > 0 %} · {{ page.tags | join: ", " }}{% endif %}</div>
<div class="prose">
{{ content }}
</div>
</article>
