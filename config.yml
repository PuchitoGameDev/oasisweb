# ---------------------------------------------------------------
# Jekyll config — powers only the /blog/ section.
# index.html at the root stays a plain static file, untouched by Jekyll.
# ---------------------------------------------------------------

title: OASIS Blog
description: "Release notes, deep dives, and what we're learning building OASIS."

# TODO: update these two once you're on a custom domain (see domain discussion).
# While on oasislocal.github.io/OASIS:
url: "https://oasislocal.github.io"
baseurl: "/OASIS"
# Once on e.g. https://oasislocal.com:
# url: "https://oasislocal.com"
# baseurl: ""

markdown: kramdown
permalink: /blog/:year/:month/:day/:title/

# All three plugins below are on GitHub Pages' whitelist, so the automatic
# build (no GitHub Actions needed) supports them out of the box.
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: blog/feed.xml

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Only these are processed by Jekyll; index.html and its existing
# assets/ folder are left completely alone.
include:
  - _posts
exclude:
  - README.md
  - "*.log"